services:
  - type: web
    name: procucev-realtime-stt
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: procucev-stt-db
          property: connectionString
      - key: GEMINI_API_KEY
        sync: false

databases:
  - name: procucev-stt-db
    plan: free
